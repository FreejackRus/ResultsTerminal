name: Quality and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck && pnpm format:check && pnpm build
      - run: pnpm openapi && git diff --exit-code -- docs/openapi
      - run: pnpm contract:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm package:gateway
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-and-docs
          path: dist/*.tar.gz
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/terminal/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --locked --manifest-path apps/terminal/src-tauri/Cargo.toml --lib
      - run: pnpm --filter @rt/terminal tauri build --bundles nsis --ci
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-windows-x64-unsigned
          path: apps/terminal/src-tauri/target/release/bundle/nsis/*.exe
  linux:
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - run: apt-get update && apt-get install -y curl git ca-certificates build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libudev-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --locked --manifest-path apps/terminal/src-tauri/Cargo.toml --lib
      - run: pnpm --filter @rt/terminal tauri build --bundles deb --ci
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-linux-x64-debian12
          path: apps/terminal/src-tauri/target/release/bundle/deb/*.deb
